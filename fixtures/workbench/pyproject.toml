[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-inference-workbench"
version = "0.1.0"
description = "Fail-closed pre-testnet workload queue and evidence journal for future FLOP inference"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

